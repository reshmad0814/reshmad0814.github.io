<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Scientist Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #2563eb);
      color: white;
      padding: 80px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      max-width: 700px;
      margin: auto;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      padding: 50px 0;
    }

    section {
      margin-bottom: 60px;
    }

    .section-title {
      font-size: 2rem;
      color: #2563eb;
      margin-bottom: 20px;
      position: relative;
    }

    .section-title::after {
      content: "";
      width: 80px;
      height: 4px;
      background: #2563eb;
      position: absolute;
      left: 0;
      bottom: -10px;
      border-radius: 20px;
    }

    .about {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .skill-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: transform 0.3s ease;
    }

    .skill-card:hover {
      transform: translateY(-5px);
    }

    .skill-card h3 {
      color: #2563eb;
      margin-bottom: 10px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .project-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .project-card:hover {
      transform: scale(1.02);
    }

    .project-card h3 {
      color: #2563eb;
      margin-bottom: 12px;
    }

    .contact {
      background: linear-gradient(135deg, #2563eb, #0f172a);
      color: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
    }

    .contact p {
      margin: 10px 0;
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #0f172a;
      color: white;
      margin-top: 40px;
    }

    @media(max-width: 768px) {
      header h1 {
        font-size: 2.2rem;
      }

      .section-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Data Scientist Portfolio</h1>
    <p>
